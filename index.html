<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bolt Profit Tracker</title>
    
    <!-- PWA & Mobile App Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Inline Manifest to make it installable without extra files -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Bolt Tracker","short_name":"BoltTrack","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2310b981%22/%3E%3Ctext x=%2250%22 y=%2265%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- CORE APP STYLES --- */
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            /* Unique Beautiful Mesh Gradient Background */
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            padding-bottom: 80px; /* Space for bottom nav */
        }

        /* --- GLASSMORPHISM CARDS --- */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* --- NAVIGATION --- */
        .top-header {
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .top-header span { color: var(--accent-green); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* iPhone notch support */
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 60px;
        }
        .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }

        /* --- DASHBOARD SPECIFIC --- */
        .filter-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            margin: 0 -20px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .filter-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 15px;
        }
        .stat-card.full { grid-column: span 2; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 800; }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.blue { color: var(--accent-blue); }
        .stat-value.orange { color: var(--accent-orange); }

        .chart-container {
            margin-top: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border-glass);
        }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary);}

        /* --- FORM SPECIFIC --- */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px; /* Prevents iOS zoom */
            outline: none;
            transition: 0.2s;
        }
        .form-input:focus { border-color: var(--accent-green); background: rgba(0,0,0,0.3); }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 10px;
        }

        /* --- INSIGHTS SPECIFIC --- */
        .insight-card {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-green);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 12px;
        }
        .insight-card.blue { border-left-color: var(--accent-blue); }
        .insight-card.orange { border-left-color: var(--accent-orange); }
        .insight-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .insight-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        .page { display: none; padding: 0 20px 20px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="top-header">
        <h1>Bolt<span>Track</span></h1>
        <div style="font-size: 12px; color: var(--text-secondary);">Jos, NG</div>
    </div>

    <!-- PAGES -->
    <main>
        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page active">
            <div class="filter-scroll">
                <button class="filter-btn active" onclick="setFilter('day', this)">Today</button>
                <button class="filter-btn" onclick="setFilter('week', this)">Week</button>
                <button class="filter-btn" onclick="setFilter('month', this)">Month</button>
                <button class="filter-btn" onclick="setFilter('quarter', this)">Quarter</button>
                <button class="filter-btn" onclick="setFilter('year', this)">Year</button>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Net Profit</div>
                    <div class="stat-value green" id="stat-profit">₦0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value blue" id="stat-km">0 km</div>
                </div>
                <div class="stat-card full">
                    <div class="stat-label">Estimated Fuel Left in Tank</div>
                    <div class="stat-value orange" id="stat-fuel">0.0 L</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Profit Trend</div>
                <canvas id="barChart" height="150"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">Revenue by Location</div>
                <canvas id="pieChart" height="200"></canvas>
            </div>
        </div>

        <!-- ADD TRIP -->
        <div id="page-add" class="page">
            <div class="glass-card">
                <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 20px;">Log Shift / Trip</h2>
                <form id="tripForm">
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" id="input-date" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location (Jos)</label>
                        <select id="input-location" required class="form-input">
                            <option value="Terminus">City Centre (Terminus)</option>
                            <option value="Ahmadu Bello Way">Ahmadu Bello Way</option>
                            <option value="Rayfield">Rayfield</option>
                            <option value="Bauchi Road">Bauchi Road</option>
                            <option value="Bukuru">Bukuru</option>
                            <option value="Zaria Road">Zaria Road</option>
                            <option value="Farin Gada">Farin Gada</option>
                            <option value="Stadium">Ahmadu Bello Stadium</option>
                            <option value="Alanamu">Alanamu</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label">Km Covered</label>
                            <input type="number" step="0.1" id="input-km" required class="form-input" placeholder="e.g. 45">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fuel Bought (L)</label>
                            <input type="number" step="0.1" id="input-fuel-liters" required class="form-input" placeholder="e.g. 5">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cost of Fuel (₦)</label>
                        <input type="number" id="input-fuel-cost" required class="form-input" placeholder="e.g. 3500">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label">Fare Paid (₦)</label>
                            <input type="number" id="input-fare" required class="form-input" placeholder="e.g. 5000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Bolt Comm. (₦)</label>
                            <input type="number" id="input-commission" required class="form-input" placeholder="e.g. 1000">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Save Trip Data</button>
                </form>
            </div>
        </div>

        <!-- INSIGHTS & SETTINGS -->
        <div id="page-insights" class="page">
            <div class="glass-card" style="margin-bottom: 20px;">
                <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 15px;">Vehicle Setup</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group" style="margin:0">
                        <label class="form-label">Efficiency (km/L)</label>
                        <input type="number" step="0.1" id="setting-efficiency" class="form-input" placeholder="10">
                    </div>
                    <div class="form-group" style="margin:0">
                        <label class="form-label">Tank Cap. (L)</label>
                        <input type="number" step="1" id="setting-capacity" class="form-input" placeholder="45">
                    </div>
                </div>
                <button onclick="saveSettings()" class="btn-primary" style="margin-top: 15px; background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);">Update Car Specs</button>
            </div>

            <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 15px; padding-left: 5px;">Business Insights</h2>
            <div id="insights-content">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Log trips to generate insights.</p>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('dashboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Dashboard
        </div>
        <div class="nav-item" onclick="showPage('add', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            Add Trip
        </div>
        <div class="nav-item" onclick="showPage('insights', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Insights
        </div>
    </nav>

    <script>
        // --- STATE & INIT ---
        let trips = JSON.parse(localStorage.getItem('bolt_trips_v2')) || [];
        let settings = JSON.parse(localStorage.getItem('bolt_settings_v2')) || { efficiency: 10, capacity: 45 };
        let currentFilter = 'day';
        let barChart, pieChart;

        document.getElementById('input-date').valueAsDate = new Date();
        document.getElementById('setting-efficiency').value = settings.efficiency;
        document.getElementById('setting-capacity').value = settings.capacity;

        // --- NAVIGATION ---
        function showPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            
            if(pageId === 'dashboard') updateDashboard();
            if(pageId === 'insights') updateInsights();
        }

        // --- SETTINGS ---
        function saveSettings() {
            settings.efficiency = parseFloat(document.getElementById('setting-efficiency').value) || 10;
            settings.capacity = parseFloat(document.getElementById('setting-capacity').value) || 45;
            localStorage.setItem('bolt_settings_v2', JSON.stringify(settings));
            alert('Car specs updated!');
        }

        // --- DATA ENTRY ---
        document.getElementById('tripForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const trip = {
                date: document.getElementById('input-date').value,
                location: document.getElementById('input-location').value,
                km: parseFloat(document.getElementById('input-km').value),
                fuelLiters: parseFloat(document.getElementById('input-fuel-liters').value),
                fuelCost: parseFloat(document.getElementById('input-fuel-cost').value),
                fare: parseFloat(document.getElementById('input-fare').value),
                commission: parseFloat(document.getElementById('input-commission').value)
            };
            
            trip.netRevenue = trip.fare - trip.commission;
            trip.profit = trip.netRevenue - trip.fuelCost;
            
            trips.push(trip);
            localStorage.setItem('bolt_trips_v2', JSON.stringify(trips));
            this.reset();
            document.getElementById('input-date').valueAsDate = new Date();
            
            // Quick visual feedback
            const btn = this.querySelector('.btn-primary');
            btn.innerText = "Saved Successfully!";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "Save Trip Data";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                showPage('dashboard', document.querySelector('.nav-item'));
            }, 1000);
        });

        // --- FILTERS ---
        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateDashboard();
        }

        function getFilteredTrips() {
            const now = new Date();
            return trips.filter(trip => {
                const tripDate = new Date(trip.date);
                if (currentFilter === 'day') return tripDate.toDateString() === now.toDateString();
                if (currentFilter === 'week') {
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return tripDate >= weekAgo;
                }
                if (currentFilter === 'month') return tripDate.getMonth() === now.getMonth() && tripDate.getFullYear() === now.getFullYear();
                if (currentFilter === 'quarter') {
                    const currentQ = Math.floor(now.getMonth() / 3);
                    const tripQ = Math.floor(tripDate.getMonth() / 3);
                    return tripQ === currentQ && tripDate.getFullYear() === now.getFullYear();
                }
                if (currentFilter === 'year') return tripDate.getFullYear() === now.getFullYear();
                return true;
            });
        }

        // --- DASHBOARD RENDER ---
        function updateDashboard() {
            const filtered = getFilteredTrips();
            const totalProfit = filtered.reduce((sum, t) => sum + t.profit, 0);
            const totalKm = filtered.reduce((sum, t) => sum + t.km, 0);
            
            // Fuel calculation (All time)
            let totalFuelBought = trips.reduce((sum, t) => sum + t.fuelLiters, 0);
            let totalFuelConsumed = trips.reduce((sum, t) => sum + (t.km / settings.efficiency), 0);
            let fuelLeft = Math.max(0, (settings.capacity - totalFuelConsumed + totalFuelBought)).toFixed(1); 

            document.getElementById('stat-profit').innerText = `₦${totalProfit.toLocaleString()}`;
            document.getElementById('stat-km').innerText = `${totalKm.toFixed(1)} km`;
            document.getElementById('stat-fuel').innerText = `${fuelLeft} L`;

            renderCharts(filtered);
        }

        function renderCharts(data) {
            // Dark mode chart defaults
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

            // Bar Chart
            const profitByDate = {};
            data.forEach(t => { profitByDate[t.date] = (profitByDate[t.date] || 0) + t.profit; });
            
            if(barChart) barChart.destroy();
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(profitByDate).map(d => new Date(d).toLocaleDateString('en-US', {day:'numeric', month:'short'})),
                    datasets: [{
                        label: 'Profit',
                        data: Object.values(profitByDate),
                        backgroundColor: 'rgba(16, 185, 129, 0.6)',
                        borderColor: '#10b981',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
            });

            // Pie Chart
            const revByLoc = {};
            data.forEach(t => { revByLoc[t.location] = (revByLoc[t.location] || 0) + t.netRevenue; });

            if(pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut', // Doughnut looks more premium than pie on mobile
                data: {
                    labels: Object.keys(revByLoc),
                    datasets: [{
                        data: Object.values(revByLoc),
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 15, usePointStyle: true } } } }
            });
        }

        // --- INSIGHTS ---
        function updateInsights() {
            const container = document.getElementById('insights-content');
            if (trips.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Log trips to generate insights.</p>';
                return;
            }

            const locStats = {};
            trips.forEach(t => {
                if(!locStats[t.location]) locStats[t.location] = { profit: 0, km: 0, trips: 0 };
                locStats[t.location].profit += t.profit;
                locStats[t.location].km += t.km;
                locStats[t.location].trips += 1;
            });

            let bestLoc = '', bestProfitPerKm = 0;
            let mostTripsLoc = '', maxTrips = 0;

            for (let loc in locStats) {
                let ppm = locStats[loc].profit / locStats[loc].km;
                if (ppm > bestProfitPerKm) { bestProfitPerKm = ppm; bestLoc = loc; }
                if (locStats[loc].trips > maxTrips) { maxTrips = locStats[loc].trips; mostTripsLoc = loc; }
            }

            container.innerHTML = `
                <div class="insight-card">
                    <div class="insight-title">📍 Most Profitable Route</div>
                    <div class="insight-text"><strong>${bestLoc}</strong> yields the highest profit per km (₦${bestProfitPerKm.toFixed(2)}/km). <br><em>Tip: Position yourself here during peak hours ( mornings/evenings) to maximize returns.</em></div>
                </div>
                <div class="insight-card blue">
                    <div class="insight-title">🚗 Highest Rider Volume</div>
                    <div class="insight-text"><strong>${mostTripsLoc}</strong> has the most trips (${maxTrips}). <br><em>Tip: High demand area. If profit/km is low here, use it for quick back-to-back trips to keep the wheels moving.</em></div>
                </div>
                <div class="insight-card orange">
                    <div class="insight-title">⛽ Fuel Efficiency</div>
                    <div class="insight-text">Your car averages <strong>${settings.efficiency} km/L</strong>. <br><em>Tip: If actual consumption increases, check tire pressure and engine health. Proper maintenance directly increases your daily net profit.</em></div>
                </div>
            `;
        }

        // Initial load
        updateDashboard();
    </script>
</body>
</html>
